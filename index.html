<!DOCTYPE html>

    <img src="junia_lira_site_images/page2_img1.jpeg" alt="Página 2" class="full-page">
    <img src="junia_lira_site_images/page2_img2.png" alt="Página 2 Parte 2" class="full-page">

</html>
